name: Portable Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet test DDVProfileConverter.slnx --configuration Release

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2025
            package: DDV-Profile-Converter-win-x64.zip
          - rid: win-arm64
            os: windows-11-arm
            package: DDV-Profile-Converter-win-arm64.zip
          - rid: osx-arm64
            os: macos-15
            package: DDV-Profile-Converter-osx-arm64.tar.gz
          - rid: osx-x64
            os: macos-15-intel
            package: DDV-Profile-Converter-osx-x64.tar.gz
          - rid: linux-x64
            os: ubuntu-24.04
            package: DDV-Profile-Converter-linux-x64.tar.gz
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            package: DDV-Profile-Converter-linux-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet publish src/DDVProfileConverter.Desktop/DDVProfileConverter.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}/publish -p:UseAppHost=true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false

      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/${{ matrix.rid }}/publish/*" -DestinationPath "artifacts/${{ matrix.package }}"

      - if: runner.os != 'Windows'
        run: tar -C "artifacts/${{ matrix.rid }}/publish" -czf "artifacts/${{ matrix.package }}" .

      - uses: actions/upload-artifact@v7
        with:
          name: DDV-Profile-Converter-${{ matrix.rid }}
          path: artifacts/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14
