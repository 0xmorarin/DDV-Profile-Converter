name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet build DDVProfileConverter.slnx --configuration Release

      - run: dotnet test DDVProfileConverter.slnx --configuration Release --no-build
